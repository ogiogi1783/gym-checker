name: probe
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - name: run probe
        run: |
          cat > probe.py <<'EOF'
          import asyncio, json
          from playwright.async_api import async_playwright
          URL = "https://s-yoyaku.e-kanagawa.lg.jp/yamato/FacilitySearch/Index"
          logs = []
          async def main():
              async with async_playwright() as p:
                  b = await p.chromium.launch()
                  ctx = await b.new_context(locale="ja-JP", timezone_id="Asia/Tokyo")
                  page = await ctx.new_page()
                  async def on_resp(r):
                      if r.request.resource_type in ("xhr", "fetch"):
                          try:
                              body = await r.text()
                          except Exception:
                              body = ""
                          logs.append({"url": r.url, "method": r.request.method,
                                       "post": r.request.post_data, "status": r.status,
                                       "body": body[:3000]})
                  page.on("response", on_resp)
                  await page.goto(URL, wait_until="networkidle")
                  await page.wait_for_timeout(5000)
                  text = await page.inner_text("body")
                  links = await page.eval_on_selector_all("a", "els => els.map(e => [e.innerText.trim(), e.href])")
                  await b.close()
              with open("probe_result.txt", "w") as f:
                  f.write("=== PAGE TEXT ===\n" + text + "\n\n=== LINKS ===\n")
                  for t, h in links:
                      if any(k in t for k in ("スポーツ", "ポラリス", "体育", "アリーナ", "空き")):
                          f.write(f"{t} -> {h}\n")
                  f.write("\n=== NETWORK ===\n" + json.dumps(logs, ensure_ascii=False, indent=1))
          asyncio.run(main())
          EOF
          python probe.py
      - run: |
          git config user.name bot && git config user.email bot@example.com
          git add probe_result.txt && git commit -m "probe result" && git push
