name: probe4
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - name: run probe
        run: |
          cat > probe4.py <<'EOF'
          import asyncio, re
          from playwright.async_api import async_playwright
          BASE = "https://s-yoyaku.e-kanagawa.lg.jp/yamato/FacilityAvailability/Index/142131/"
          PAGES = [
              ("sports_1st", BASE + "1001?rc=101&ptn=1"),
              ("sports_3rd", BASE + "1001?rc=111&ptn=1"),
              ("polaris_arena", BASE + "2002?rc=161&ptn=1"),
          ]
          out = []
          async def close_help(page):
              for t in ("スキップ", "閉じる"):
                  try:
                      await page.get_by_role("button", name=t).first.click(timeout=3000)
                  except Exception:
                      pass
              await page.keyboard.press("Escape")
              await page.wait_for_timeout(1500)
          async def grab(page, logs, label):
              await page.wait_for_timeout(5000)
              out.append(f"\n=== {label} URL: {page.url}\n")
              txt = await page.inner_text("body")
              i = txt.find("空き状況カレンダー")
              out.append(txt[max(0, i):i + 2500] + "\n")
              for m, u, pd, body in logs:
                  if "GetEvent" in u or "GetCalendar" in u:
                      continue
                  out.append(f"\n--- {m} {u}\nPOST: {pd}\n{body[:12000]}\n")
              logs.clear()
          async def main():
              async with async_playwright() as p:
                  b = await p.chromium.launch()
                  ctx = await b.new_context(locale="ja-JP", timezone_id="Asia/Tokyo")
                  first = True
                  for name, url in PAGES:
                      out.append(f"\n\n########## {name} ##########\n")
                      page = await ctx.new_page()
                      logs = []
                      async def on_resp(r, logs=logs):
                          if r.request.resource_type in ("xhr", "fetch"):
                              try:
                                  body = await r.text()
                              except Exception:
                                  body = ""
                              logs.append((r.request.method, r.url, r.request.post_data, body))
                      page.on("response", on_resp)
                      await page.goto(url, wait_until="networkidle")
                      await page.wait_for_timeout(3000)
                      if first:
                          first = False
                          out.append("\n=== API NAMES FROM SCRIPTS ===\n")
                          srcs = await page.eval_on_selector_all("script[src]", "els => els.map(e => e.src)")
                          found = set()
                          for s in srcs:
                              try:
                                  js = await (await ctx.request.get(s)).text()
                              except Exception:
                                  continue
                              for mm in re.finditer(r"FacilityAvailability/[A-Za-z]+", js):
                                  if mm.group(0) not in found:
                                      found.add(mm.group(0))
                                      a = max(0, mm.start() - 300)
                                      out.append(f"\n[{mm.group(0)}] in {s}\n{js[a:mm.end() + 600]}\n")
                      await close_help(page)
                      logs.clear()
                      try:
                          await page.get_by_text("trip_origin").first.click(timeout=8000, force=True)
                          await grab(page, logs, "open_day_click")
                      except Exception as e:
                          out.append(f"click failed: {str(e)[:300]}\n")
                      await page.close()
                  await b.close()
              with open("probe4_result.txt", "w") as f:
                  f.write("".join(out))
          asyncio.run(main())
          EOF
          python probe4.py
      - run: |
          git config user.name bot && git config user.email bot@example.com
          git add probe4_result.txt && git commit -m "probe4 result" && git push
