name: probe2
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - name: run probe
        run: |
          cat > probe2.py <<'EOF'
          import asyncio, json
          from playwright.async_api import async_playwright
          BASE = "https://s-yoyaku.e-kanagawa.lg.jp/yamato"
          PAGES = [
              ("search", BASE + "/FacilitySearch/Index"),
              ("sports_1st", BASE + "/FacilityAvailability/Index/142131/1001?rc=101&ptn=1"),
              ("sports_3rd", BASE + "/FacilityAvailability/Index/142131/1001?rc=111&ptn=1"),
              ("polaris", BASE + "/FacilityAvailability/Index/142131/2002?ptn=1"),
          ]
          out = []
          async def main():
              async with async_playwright() as p:
                  b = await p.chromium.launch()
                  ctx = await b.new_context(locale="ja-JP", timezone_id="Asia/Tokyo")
                  for name, url in PAGES:
                      page = await ctx.new_page()
                      logs = []
                      async def on_resp(r, logs=logs):
                          if r.request.resource_type in ("xhr", "fetch"):
                              try:
                                  body = await r.text()
                              except Exception:
                                  body = ""
                              logs.append((r.request.method, r.url, r.request.post_data, body))
                      page.on("response", on_resp)
                      await page.goto(url, wait_until="networkidle")
                      await page.wait_for_timeout(5000)
                      text = await page.inner_text("body")
                      out.append(f"\n\n########## {name} ##########\n")
                      if name == "search":
                          for m, u, pd, body in logs:
                              if u.endswith("/FacilitySearch/Search"):
                                  for f in json.loads(body).get("fs", []):
                                      if f["fc"] in ("1001", "2002"):
                                          out.append(f'{f["fc"]} {f["fn"]}\n')
                                          for r in f["rs"]:
                                              out.append(f'  rc={r["rc"]} {r["rn"]} net={r["n"]}\n')
                          await page.close()
                          continue
                      out.append("=== PAGE TEXT ===\n" + text[:5000] + "\n=== NETWORK ===\n")
                      for m, u, pd, body in logs:
                          out.append(f"\n--- {m} {u}\nPOST: {pd}\n{body[:15000]}\n")
                      await page.close()
                  await b.close()
              with open("probe2_result.txt", "w") as f:
                  f.write("".join(out))
          asyncio.run(main())
          EOF
          python probe2.py
      - run: |
          git config user.name bot && git config user.email bot@example.com
          git add probe2_result.txt && git commit -m "probe2 result" && git push
